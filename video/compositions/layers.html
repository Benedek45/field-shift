<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: var(--ground);
      font-family: var(--font-display);
      color: var(--ink);
    }
    #l-county {
      position: absolute;
      left: 230px;
      top: 70px;
      font-size: 34px;
      font-weight: 800;
      color: var(--muted);
    }
    .l-panel {
      position: absolute;
      width: 715px;
      height: 340px;
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 18px 24px 0 24px;
    }
    #l-p1 { left: 230px; top: 130px; }
    #l-p2 { left: 975px; top: 130px; }
    #l-p3 { left: 230px; top: 490px; }
    #l-p4 { left: 975px; top: 490px; }
    .l-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 32px;
      font-weight: 800;
    }
    .l-head i {
      font-style: normal;
      font-size: 28px;
      font-weight: 700;
      color: var(--green);
    }
    .l-chart {
      position: absolute;
      left: 16px;
      top: 70px;
      width: 683px;
      height: 255px;
    }
    .l-chart svg {
      width: 683px;
      height: 255px;
      overflow: visible;
    }
    .cap {
      position: absolute;
      left: 230px;
      top: 872px;
      width: 1460px;
      display: flex;
      align-items: center;
      gap: 26px;
      font-size: 50px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .cap b {
      flex: none;
      width: 76px;
      height: 76px;
      border-radius: 38px;
      background: var(--green);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
    }
    #l-more {
      position: absolute;
      left: 232px;
      top: 976px;
      font-size: 28px;
      color: var(--muted);
    }
  </style>
  <div id="root" data-composition-id="layers" data-width="1920" data-height="1080">
    <div id="l-county">Story County, Iowa · real county series</div>
    <div id="l-p1" class="l-panel">
      <div class="l-head"><span>Summer rain, 1981–2025</span><i>NASA POWER</i></div>
      <div class="l-chart" id="l-c1"></div>
    </div>
    <div id="l-p2" class="l-panel">
      <div class="l-head"><span>Crop greenness</span><i>MODIS NDVI</i></div>
      <div class="l-chart" id="l-c2"></div>
    </div>
    <div id="l-p3" class="l-panel">
      <div class="l-head"><span>Root-zone soil moisture</span><i>SMAP</i></div>
      <div class="l-chart" id="l-c3"></div>
    </div>
    <div id="l-p4" class="l-panel">
      <div class="l-head"><span>Total water storage</span><i>GRACE</i></div>
      <div class="l-chart" id="l-c4"></div>
    </div>
    <div id="l-cap" class="cap">
      <b>2</b><span>Every US county gets 45 years of NASA and USDA data.</span>
    </div>
    <div id="l-more">Also: USDA NASS yields and prices · PRISM rain · US Drought Monitor · soil maps</div>
  </div>
  <script>
    (function () {
      const D = window.STORY_LAYERS;
      const W = 683, H = 255, padL = 62, padB = 34, padT = 30, padR = 10;
      const ink = "#17241b", muted = "#56665a", grid = "#e3dfd2";
      const fs = 20;
      function sx(v, lo, hi) { return padL + ((v - lo) / (hi - lo)) * (W - padL - padR); }
      function sy(v, lo, hi) { return H - padB - ((v - lo) / (hi - lo)) * (H - padB - padT); }
      function axisY(ticks, lo, hi, fmt) {
        return ticks.map((t) => {
          const y = sy(t, lo, hi);
          return `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="${grid}" stroke-width="1.5"/>` +
            `<text x="${padL - 10}" y="${y + 7}" font-size="${fs}" text-anchor="end" fill="${muted}">${fmt(t)}</text>`;
        }).join("");
      }
      function xLabel(x, text) {
        return `<text x="${x}" y="${H - 6}" font-size="${fs}" text-anchor="middle" fill="${muted}">${text}</text>`;
      }
      function path(xs, ys) {
        let d = "", pen = false;
        xs.forEach((x, i) => {
          if (ys[i] === null || ys[i] === undefined) { pen = false; return; }
          d += (pen ? "L" : "M") + x.toFixed(1) + "," + ys[i].toFixed(1);
          pen = true;
        });
        return d;
      }
      // 1. NASA POWER June-August rain per year
      {
        const yrs = D.power_jja_rain_mm.years, vals = D.power_jja_rain_mm.values;
        const lo = 0, hi = 700;
        const bw = (W - padL - padR) / yrs.length;
        let s = axisY([0, 200, 400, 600], lo, hi, (t) => t);
        s += `<text x="${padL + 4}" y="${padT - 10}" font-size="${fs}" fill="${muted}">mm, June–August</text>`;
        yrs.forEach((yr, i) => {
          const v = vals[i];
          const x = padL + i * bw + 1.5;
          const y = sy(v, lo, hi);
          const hot = yr === 1988 || yr === 2012;
          s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${(H - padB - y).toFixed(1)}" fill="${hot ? "#b86e12" : "#2f5f8a"}" opacity="${hot ? 1 : 0.55}"/>`;
          if (hot) s += `<text x="${x + bw / 2}" y="${y - 10}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="#b86e12">${yr}</text>`;
          if (yr % 10 === 0) s += xLabel(x + bw / 2, yr);
        });
        document.getElementById("l-c1").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
      }
      // 2. MODIS NDVI seasonal curves 2011-2013
      {
        const lo = 0, hi = 1;
        let s = axisY([0, 0.5, 1], lo, hi, (t) => t.toFixed(1));
        const months = [["Jan", 1], ["Apr", 91], ["Jul", 182], ["Oct", 274]];
        months.forEach(([m, d]) => { s += xLabel(sx(d, 1, 366), m); });
        const style = { "2011": ["#2e6b3f", 4], "2012": ["#b86e12", 5], "2013": ["#8a9a8e", 3] };
        const labelAt = { "2011": [130, 0.9], "2012": [262, 0.78], "2013": [292, 0.5] };
        Object.keys(style).forEach((yr) => {
          const ser = D.modis_ndvi[yr];
          const xs = ser.doy.map((d) => sx(d, 1, 366));
          const ys = ser.ndvi.map((v) => (v === null ? null : sy(v, lo, hi)));
          s += `<path d="${path(xs, ys)}" fill="none" stroke="${style[yr][0]}" stroke-width="${style[yr][1]}" stroke-linejoin="round"/>`;
          const [ld, lv] = labelAt[yr];
          s += `<text x="${sx(ld, 1, 366)}" y="${sy(lv, lo, hi)}" font-size="${fs + 2}" font-weight="800" fill="${style[yr][0]}">${yr}${yr === "2012" ? " drought" : ""}</text>`;
        });
        document.getElementById("l-c2").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
      }
      // 3. SMAP root-zone soil moisture, monthly
      {
        const dates = D.smap_rootzone_monthly.dates, vals = D.smap_rootzone_monthly.values;
        const t = dates.map((d) => +d.slice(0, 4) + (+d.slice(5, 7) - 0.5) / 12);
        const x0 = 2015, x1 = 2026, lo = 0.15, hi = 0.4;
        let s = axisY([0.2, 0.3, 0.4], lo, hi, (v) => v.toFixed(1));
        s += `<text x="${padL + 4}" y="${padT - 10}" font-size="${fs}" fill="${muted}">m³ water per m³ soil</text>`;
        [2016, 2020, 2024].forEach((y) => { s += xLabel(sx(y, x0, x1), y); });
        s += `<path d="${path(t.map((v) => sx(v, x0, x1)), vals.map((v) => sy(v, lo, hi)))}" fill="none" stroke="#2f5f8a" stroke-width="4" stroke-linejoin="round"/>`;
        document.getElementById("l-c3").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
      }
      // 4. GRACE total water storage anomaly, monthly
      {
        const dates = D.grace_tws_cm_monthly.dates, vals = D.grace_tws_cm_monthly.values;
        const t = dates.map((d) => +d.slice(0, 4) + (+d.slice(5, 7) - 0.5) / 12);
        const x0 = 2002, x1 = 2025;
        const lo = Math.floor(Math.min(...vals) / 5) * 5, hi = Math.ceil(Math.max(...vals) / 5) * 5;
        const ticks = [];
        for (let v = lo; v <= hi; v += 10) ticks.push(v);
        let s = axisY(ticks, lo, hi, (v) => v);
        s += `<text x="${padL + 4}" y="${padT - 10}" font-size="${fs}" fill="${muted}">cm of water vs. average</text>`;
        [2005, 2012, 2019].forEach((y) => { s += xLabel(sx(y, x0, x1), y); });
        s += `<path d="${path(t.map((v) => sx(v, x0, x1)), vals.map((v) => sy(v, lo, hi)))}" fill="none" stroke="#2e6b3f" stroke-width="4" stroke-linejoin="round"/>`;
        document.getElementById("l-c4").innerHTML = `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
      }
    })();
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#l-county", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
    tl.fromTo(".l-panel", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.1 }, 0.05);
    tl.fromTo(".l-chart", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: "power2.inOut", stagger: 0.15 }, 0.35);
    tl.fromTo("#l-cap", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.2);
    tl.fromTo("#l-more", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9);
    tl.to("#root", { opacity: 0, duration: 0.15, ease: "power2.in" }, 3.64);
    window.__timelines["layers"] = tl;
  </script>
</template>
