[project]
name = "fieldshift"
version = "0.1.0"
description = "Crop-rotation decision support using NASA Earth observations (NASA Space Apps 2026: Field Shift)"
authors = [
    { name = "Benedek45", email = "137995689+Benedek45@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.52",
    "fsspec>=2026.9.0",
    "geopandas>=1.2.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "zarr>=3.4.2",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
